#cloud-config
package_update: true
package_upgrade: false
packages:
  - nginx
  - unzip
  - curl
  - php-fpm
  - php-mysql
  - php-xml
  - php-curl
  - php-zip
  - php-mbstring
  - mariadb-server

write_files:
  - path: /etc/nginx/sites-available/wordpress
    owner: root:root
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;
          root /var/www/html;
          index index.php index.html;

          location / {
              try_files $uri $uri/ /index.php?$args;
          }

          location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/php-fpm.sock;
          }

          location ~* \.(?:htaccess|git) {
              deny all;
          }
      }

runcmd:
  - mkdir -p /var/www/html
  - cd /var/www/html
  - curl -LO https://wordpress.org/latest.zip
  - unzip -o latest.zip
  - mv -f wordpress/* .
  - rm -rf wordpress latest.zip
  - chown -R www-data:www-data /var/www/html
  - find /var/www/html -type d -exec chmod 755 {} \;
  - find /var/www/html -type f -exec chmod 644 {} \;

  - ln -sf /etc/nginx/sites-available/wordpress /etc/nginx/sites-enabled/wordpress
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl enable --now nginx
  - systemctl enable --now php-fpm || systemctl enable --now php8.1-fpm || systemctl enable --now php8.2-fpm || systemctl enable --now php8.3-fpm

  # MariaDB + учётки из переменных
  - systemctl enable --now mariadb
  - mysql -e "CREATE DATABASE ${db_name} DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  - mysql -e "CREATE USER '${db_user}'@'localhost' IDENTIFIED BY '${db_pass}';"
  - mysql -e "GRANT ALL PRIVILEGES ON ${db_name}.* TO '${db_user}'@'localhost'; FLUSH PRIVILEGES;"

  # Преднастраиваем wp-config.php с теми же переменными
  - cp -n /var/www/html/wp-config-sample.php /var/www/html/wp-config.php
  - sed -i "s/database_name_here/${db_name}/" /var/www/html/wp-config.php
  - sed -i "s/username_here/${db_user}/" /var/www/html/wp-config.php
  - sed -i "s/password_here/${db_pass}/" /var/www/html/wp-config.php
  - sed -i "s/localhost/${db_host}/" /var/www/html/wp-config.php

  # Ключи соли
  - bash -lc "curl -s https://api.wordpress.org/secret-key/1.1/salt/ > /tmp/wp.keys"
  - sed -i "/AUTH_KEY/d;/SECURE_AUTH_KEY/d;/LOGGED_IN_KEY/d;/NONCE_KEY/d;/AUTH_SALT/d;/SECURE_AUTH_SALT/d;/LOGGED_IN_SALT/d;/NONCE_SALT/d" /var/www/html/wp-config.php
  - awk '1;/^define..DB_COLLATE../{system(\"cat /tmp/wp.keys\")}' /var/www/html/wp-config.php > /var/www/html/wp-config.php.new
  - mv /var/www/html/wp-config.php.new /var/www/html/wp-config.php
  - chown www-data:www-data /var/www/html/wp-config.php
  - chmod 640 /var/www/html/wp-config.php

  - systemctl reload nginx
